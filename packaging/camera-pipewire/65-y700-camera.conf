# Stable names for the three PRC sensors enumerated by libcamera.
monitor.libcamera.rules = [
  {
    matches = [ {
      factory.name = api.libcamera.source
      api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@0/camera@20"
    } ]
    actions = { update-props = {
      node.name = y700_camera_rear
      media.role = Camera
      node.description = "Y700 Rear Camera"
      node.nick = "Rear Camera"
    } }
  }
  {
    matches = [ {
      factory.name = api.libcamera.source
      api.libcamera.path = "/base/soc@0/cci@ac15000/i2c-bus@1/camera@10"
    } ]
    actions = { update-props = {
      node.name = y700_camera_front
      media.role = Camera
      node.description = "Y700 Front Camera"
      node.nick = "Front Camera"
    } }
  }
  {
    matches = [ {
      factory.name = api.libcamera.source
      api.libcamera.path = "/base/soc@0/cci@ac16000/i2c-bus@0/camera@36"
    } ]
    actions = { update-props = {
      node.name = y700_camera_macro
      media.role = Camera
      node.description = "Y700 Rear Macro Camera"
      node.nick = "Rear Macro Camera"
    } }
  }
]
