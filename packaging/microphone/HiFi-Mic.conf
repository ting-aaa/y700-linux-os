# The installed HiFi verb retains the speaker sequence and factory calibration.
Include.speakers.File "/Lenovo-Y700/HiFi.conf"

# AudioReach FE 2 is MultiMedia3. Playback-only boards have no D2c endpoint.
If.capture {
    Condition {
        Type Path
        Path "/sys/class/sound/pcmC${CardNumber}D2c"
        Mode exist
    }
    True.If.tx3 {
        Condition {
            Type ControlExists
            Control "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3'"
        }
        True.If.wcd {
            Condition {
                Type ControlExists
                Control "name='ADC3 MUX'"
                ControlEnum "INP4"
            }
            True.If.txmacro {
                Condition {
                    Type ControlExists
                    Control "name='TX SMIC MUX5'"
                    ControlEnum "SWR_MIC8"
                }
                True {
                    SectionVerb {
                        EnableSequence [
                            cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 1"
                        ]
                        DisableSequence [
                            cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' 0"
                        ]
                    }
                    Include.mic.File "/Lenovo-Y700/Mic.conf"
                }
            }
        }
    }
}
