SectionDevice."Mic" {
    Comment "Internal microphones"

    EnableSequence [
        cset "name='TX0 MODE' ADC_NORMAL"
        cset "name='TX2 MODE' ADC_NORMAL"
        cset "name='ADC3 MUX' INP4"
        cset "name='HDR34 MUX' NO_HDR34"
        # Analog PGA (+27 dB) + TX decimator (+18 dB) brings normal speech
        # from the -38 dBV/Pa MEMS microphones into a clean -20 to -12 dBFS band
        # without Android QDSP6 ACDB post-gain.
        cset "name='ADC1 Volume' 18"
        cset "name='ADC3 Volume' 18"
        cset "name='TX_DEC2 Volume' 102"
        cset "name='TX_DEC5 Volume' 102"
        # WCD938x exposes separate SoundWire port and ADC DAPM switches.
        cset "name='ADC1 Switch' 1"
        cset "name='ADC3 Switch' 1"
        cset "name='ADC1_MIXER Switch' 1"
        cset "name='ADC3_MIXER Switch' 1"
        cset "name='TX DEC2 MUX' SWR_MIC"
        cset "name='TX DEC5 MUX' SWR_MIC"
        cset "name='TX SMIC MUX2' SWR_MIC4"
        cset "name='TX SMIC MUX5' SWR_MIC8"
        cset "name='TX_AIF1_CAP Mixer DEC2' 1"
        cset "name='TX_AIF1_CAP Mixer DEC5' 1"
    ]

    DisableSequence [
        cset "name='TX_AIF1_CAP Mixer DEC5' 0"
        cset "name='TX_AIF1_CAP Mixer DEC2' 0"
        cset "name='TX SMIC MUX5' ZERO"
        cset "name='TX SMIC MUX2' ZERO"
        cset "name='ADC3_MIXER Switch' 0"
        cset "name='ADC1_MIXER Switch' 0"
        cset "name='ADC3 Switch' 0"
        cset "name='ADC1 Switch' 0"
    ]

    Value {
        CapturePCM "hw:${CardId},2"
        CaptureChannels 2
        CaptureRate 48000
        CaptureFormat "S16_LE"
        CapturePriority 100
    }
}
