Section "Device"
    Identifier "Virtual panel"
    Driver "dummy"
    DacSpeed 400
    VideoRam 32768
EndSection
Section "Monitor"
    Identifier "Test display"
    HorizSync 5-200
    VertRefresh 5-160
    Modeline "2560x1600" 348.50 2560 2752 3032 3504 1600 1603 1609 1658 -HSync +VSync
EndSection
Section "Screen"
    Identifier "Test screen"
    Device "Virtual panel"
    Monitor "Test display"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Virtual 2560 1600
        Modes "2560x1600"
    EndSubSection
EndSection
