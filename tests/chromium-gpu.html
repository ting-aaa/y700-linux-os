<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Y700 Chromium WebGL probe</title>
<canvas width="96" height="64" style="width: 480px; max-width: 100%; image-rendering: pixelated"></canvas>
<pre role="status">Running the WebGL probe…</pre>
<script>
"use strict";
const canvas = document.querySelector("canvas");
const status = document.querySelector("pre");
const requested = Number(new URLSearchParams(location.search).get("frames"));
const report = {frames: 0, samples: [], userAgent: navigator.userAgent};

function shader(gl, type, source) {
    const value = gl.createShader(type);
    gl.shaderSource(value, source);
    gl.compileShader(value);
    if (!gl.getShaderParameter(value, gl.COMPILE_STATUS)) {
        throw new Error(gl.getShaderInfoLog(value));
    }
    return value;
}

async function render() {
    if (!Number.isInteger(requested) || requested < 2 || requested > 3600) {
        throw new Error("Invalid frame count");
    }
    if (navigator.userAgentData) {
        try {
            const ua = await navigator.userAgentData.getHighEntropyValues(["fullVersionList"]);
            report.browserVersions = ua.fullVersionList;
        } catch {
            // The reduced user agent remains available if policy restricts client hints.
        }
    }
    const gl = canvas.getContext("webgl2", {antialias: false, preserveDrawingBuffer: true});
    if (!gl) throw new Error("WebGL 2 context unavailable");
    const debug = gl.getExtension("WEBGL_debug_renderer_info");
    report.vendor = debug ? gl.getParameter(debug.UNMASKED_VENDOR_WEBGL) : null;
    report.renderer = debug ? gl.getParameter(debug.UNMASKED_RENDERER_WEBGL) : null;
    report.version = gl.getParameter(gl.VERSION);
    report.shadingLanguage = gl.getParameter(gl.SHADING_LANGUAGE_VERSION);

    const program = gl.createProgram();
    gl.attachShader(program, shader(gl, gl.VERTEX_SHADER, `#version 300 es
        void main() {
            vec2 vertices[3] = vec2[3](vec2(-1., -1.), vec2(3., -1.), vec2(-1., 3.));
            gl_Position = vec4(vertices[gl_VertexID], 0., 1.);
        }`));
    gl.attachShader(program, shader(gl, gl.FRAGMENT_SHADER, `#version 300 es
        precision highp float;
        uniform int phase;
        out vec4 color;
        void main() {
            int cell = int(gl_FragCoord.x >= 48.) + 2 * int(gl_FragCoord.y >= 32.);
            int index = (cell + phase) % 4;
            color = vec4(float(index == 0), float(index == 1), float(index == 2), 1.);
        }`));
    gl.linkProgram(program);
    if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
        throw new Error(gl.getProgramInfoLog(program));
    }
    gl.useProgram(program);
    gl.disable(gl.DITHER);
    gl.viewport(0, 0, canvas.width, canvas.height);
    const phase = gl.getUniformLocation(program, "phase");
    const pixels = new Uint8Array(canvas.width * canvas.height * 4);
    const centers = [[24, 16], [72, 16], [24, 48], [72, 48]];
    const start = performance.now();
    for (let frame = 0; frame < requested; frame++) {
        await new Promise(resolve => requestAnimationFrame(resolve));
        gl.uniform1i(phase, frame % 2);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
        const glError = gl.getError();
        if (gl.isContextLost() || glError !== gl.NO_ERROR) {
            throw new Error(`WebGL error or context loss at frame ${frame} (0x${glError.toString(16)})`);
        }
        const sample = centers.map(([x, y]) => {
            const offset = (y * canvas.width + x) * 4;
            return Array.from(pixels.subarray(offset, offset + 4));
        });
        if (frame < 2) report.samples.push(sample);
        for (let cell = 0; cell < centers.length; cell++) {
            const index = (cell + frame % 2) % 4;
            const expected = [index === 0 ? 255 : 0, index === 1 ? 255 : 0, index === 2 ? 255 : 0, 255];
            if (!sample[cell].every((value, channel) => value === expected[channel])) {
                report.mismatch = {frame, cell, actual: sample[cell], expected};
                throw new Error(`Pixel mismatch at frame ${frame}, sample ${cell}`);
            }
        }
        report.frames++;
    }
    report.elapsedMs = Math.round(performance.now() - start);
}

async function run() {
    try {
        await render();
    } catch (error) {
        report.error = error.message;
    }
    status.textContent = JSON.stringify(report, null, 2);
    await fetch(location.pathname, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(report),
    });
}

run().catch(error => { status.textContent += `\n${error.message}`; });
</script>
</html>
