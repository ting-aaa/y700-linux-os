Section "ServerFlags"
 Option "AutoAddDevices" "false"
 Option "AutoEnableDevices" "false"
 Option "AutoAddGPU" "false"
 Option "DontVTSwitch" "true"
EndSection
Section "Device"
 Identifier "dummy card"
 Driver "dummy"
 VideoRam 65536
 DacSpeed 400
EndSection
Section "Monitor"
 Identifier "private panel"
 HorizSync 5-200
 VertRefresh 5-200
 Modeline "2560x1600" 268.50 2560 2608 2640 2720 1600 1603 1609 1646 +hsync -vsync
EndSection
Section "Screen"
 Identifier "private screen"
 Monitor "private panel"
 Device "dummy card"
 DefaultDepth 24
 SubSection "Display"
  Modes "2560x1600"
 EndSubSection
EndSection
Section "InputDevice"
 Identifier "Y700 private XI2 touch"
 Driver "inputtest"
 Option "DeviceType" "Touch"
 Option "SocketPath" "/run/y700-xi.sock"
EndSection
Section "ServerLayout"
 Identifier "private"
 Screen "private screen"
 InputDevice "Y700 private XI2 touch" "CorePointer"
EndSection
