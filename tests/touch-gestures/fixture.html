<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Y700 Chromium touch gestures</title>
<style>
  body { margin: 0; min-height: 500vh; background: repeating-linear-gradient(#dbeafe 0 128px, #f0f9ff 128px 256px); }
  h1 { margin: 20px; font: 24px sans-serif; }
  button { position: fixed; translate: -50% -50%; min-width: 44px; min-height: 44px; }
</style>
<h1>Y700 Chromium touch gestures</h1>
<button data-target="normal" style="left: 24.5%; top: 66%">Normal</button>
<button data-target="left" style="left: 34%; top: 24.5%">Left</button>
<button data-target="inverted" style="left: 75.5%; top: 34%">Inverted</button>
<button data-target="right" style="left: 66%; top: 75.5%">Right</button>
<script>
  const rotation = new URLSearchParams(location.search).get('rotation');
  const viewport = () => ({ width: innerWidth, height: innerHeight, scroll: scrollY,
                            scale: visualViewport.scale, dpr: devicePixelRatio });
  const point = e => ({ x: e.clientX / innerWidth, y: e.clientY / innerHeight });
  const gestures = [];
  const taps = [];
  const clicks = [];
  let touches = 0;
  let frames = 0;
  function painted() {
    if (++frames < 8) requestAnimationFrame(painted);
  }
  requestAnimationFrame(painted);
  let active = null;
  let single = null;
  let sending = false;
  addEventListener('touchstart', event => {
    touches++;
    if (event.touches.length === 1) {
      single = { ...point(event.touches[0]), target: event.target.dataset.target ?? null,
                 trusted: event.isTrusted };
    } else if (event.touches.length === 2 && !active) {
      single = null;
      active = { before: viewport(), points: Array.from(event.touches, point),
                 trusted: event.isTrusted };
    }
  }, { passive: true });
  function finish(event) {
    if (active && event.touches.length < 2) {
      gestures.push({ ...active, finish: event.type });
      active = null;
    }
    if (single && event.touches.length === 0) {
      if (event.type === 'touchend') taps.push(single);
      single = null;
    }
  }
  addEventListener('touchend', finish, { passive: true });
  addEventListener('touchcancel', finish, { passive: true });
  addEventListener('click', event => {
    clicks.push({ target: event.target.dataset.target ?? null, trusted: event.isTrusted,
      touch: event.pointerType === 'touch' || event.sourceCapabilities?.firesTouchEvents === true });
  });
  setInterval(async () => {
    if (sending) return;
    sending = true;
    try {
      await fetch('/record', { method: 'POST', body: JSON.stringify({ rotation, viewport: viewport(),
        gestures, taps, clicks,
        touches, frames, loaded: document.readyState, visible: document.visibilityState,
        focused: document.hasFocus() }) });
    } finally {
      sending = false;
    }
  }, 150);
</script>
